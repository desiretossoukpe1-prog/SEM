name: Build SEM reports

on:
  push:
    paths:
      - "data/outputs/**.out"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python src/build_report.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: sem-reports
          path: reports/
      - name: Save reports in the repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "Update SEM reports" && git push)
